name: GPT Native 2026-11-07 welcome-to-github targeted verification
on:
  push:
    branches:
      - gpt-native/2026-11-07-h1-signal-observe
permissions:
  contents: read
jobs:
  verify-native-record:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: gpt-native/2026-11-07-h1-signal-observe
          fetch-depth: 0
          persist-credentials: false
      - name: Targeted source and document contracts
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python3 --version
          python3 horizon-cortex/check.py horizon-cortex/2026-11-07-H1-signal-observe.md
      - name: Check canonical identity and bounded outputs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('horizon-cortex/2026-11-07-H1-signal-observe.md')
          s=p.read_text(); assert 'Original Execution Status:' in s and 'Current Path Status:' in s
          print('H1_CANONICAL_RECORD_VERIFIED',p)
          PY
      - name: No run-time write to repository tree
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
