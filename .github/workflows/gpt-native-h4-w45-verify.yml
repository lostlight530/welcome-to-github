name: GPT Native W45 H4 contract
on:
  push:
    branches:
      - gpt-native/horizon-h4-2026w45
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Contract validation
        run: python3 horizon-cortex/check.py horizon-cortex/2026-W45-H4-narrative-act.md
      - name: No code write
        run: test -z "$(git status --porcelain)"
