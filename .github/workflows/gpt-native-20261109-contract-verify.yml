name: GPT Native 2026-11-09 exact-branch contract verification
on:
  push:
    branches:
      - gpt-native/horizon-h1-20261109
permissions:
  contents: read
jobs:
  contract-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Exact branch checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify native contract
        run: python3 horizon-cortex/check.py horizon-cortex/2026-11-09-H1-signal-observe.md
      - name: Verify no checkout writes
        run: test -z "$(git status --porcelain)"
